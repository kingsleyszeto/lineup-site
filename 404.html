<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineup</title>
<meta name="description" content="Track every show, see who's going, find your way to a ticket.">
<!-- GitHub Pages serves this page for every path that isn't a real file,
     which is how /invite/<id> gets answered at all: those ids are created
     per invite, so no static file can exist for them.

     Anyone landing here on an /invite/ URL has an invite but NOT the app —
     iOS hands the link straight to Lineup when it's installed and never
     reaches the web (see .well-known/apple-app-site-association). So this
     page's job is to explain where to get it, not to redeem anything. -->
<style>
:root {
  --bg: #121110;
  --card: #1A1917;
  --border: #26241f;
  --text: #F4F1EC;
  --muted: #8E8983;
  --accent: #F0C24C;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}

main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 3rem 1.5rem 5rem;
}

h1 {
  font-size: 2rem;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin: 0 0 0.5rem;
}

a { color: var(--accent); }
a:hover { text-decoration: none; }

.hero {
  min-height: 70vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.mark {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.75rem;
}

.mark span {
  width: 22px;
  height: 22px;
  border-radius: 8px;
  background: #14130A;
}

.tagline {
  color: var(--muted);
  font-size: 1.05rem;
  max-width: 26rem;
  margin: 0.5rem 0 2rem;
}

.soon {
  display: inline-block;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  border-radius: 999px;
  padding: 0.4rem 0.9rem;
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 2.5rem;
}

footer {
  margin-top: 4rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.875rem;
}
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="mark"><span></span></div>

    <!-- Defaults to the not-found copy, so the page still says something
         true with JavaScript disabled. The invite wording is swapped in
         below only when the path actually is an invite. -->
    <h1 id="title">Page not found</h1>
    <p class="tagline" id="tagline">
      That link doesn&rsquo;t go anywhere. <a href="/">Head to the Lineup home page</a> instead.
    </p>

    <p id="cta" hidden>
      <span class="soon">Coming soon to iOS</span>
      <!-- Launch day: replace this badge with a link to
           https://apps.apple.com/app/id6808850418. Nothing in the app needs
           to change — invite links already point here. -->
    </p>
  </div>

  <footer>
    <p>Questions? <a href="mailto:lineup@kingsleyszeto.me">lineup@kingsleyszeto.me</a></p>
  </footer>
</main>

<script>
  if (location.pathname.indexOf('/invite/') === 0) {
    document.getElementById('title').textContent = 'You’ve been invited to Lineup';
    document.getElementById('tagline').innerHTML =
      'Track every show, see who&rsquo;s going, find your way to a ticket. ' +
      'Get the app, then open your invite link again to add your friend.';
    document.getElementById('cta').hidden = false;
  }
</script>
</body>
</html>
